[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-sap-mm"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["sap_assistant"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requer TEST_DATABASE_URL com PostgreSQL e pgvector"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
